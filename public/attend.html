<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Check-In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 15px; margin-bottom: 32px; }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }
        input[type="text"]:focus { border-color: #4f46e5; }
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.submit-btn:hover { background: #4338ca; }
        button.submit-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
            display: none;
        }
        .result.success { background: #d1fae5; color: #065f46; }
        .result.warning { background: #fef3c7; color: #92400e; }
        .result.error   { background: #fee2e2; color: #991b1b; }
        .result.info    { background: #ede9fe; color: #4c1d95; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📋</div>
        <h1>Attendance</h1>
        <p class="subtitle" id="subtitle">Enter your full name to mark attendance</p>

        <div id="form-section">
            <input type="text" id="nameInput" placeholder="e.g. John Smith"
                   autocomplete="name" autocapitalize="words"
                   onkeydown="if(event.key==='Enter') submitAttendance()" />
            <button class="submit-btn" id="submitBtn" onclick="submitAttendance()">Check In</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session');

        if (!sessionId) {
            document.getElementById('subtitle').textContent = 'Invalid link. Please scan the QR code again.';
            document.getElementById('form-section').style.display = 'none';
        }

        async function submitAttendance() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            if (!name) { nameInput.focus(); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Checking in\u2026';

            try {
                const res = await fetch('/api/attend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, name })
                });
                const data = await res.json();
                showResult(data);
            } catch {
                showMessage('error', '\u274C Network error. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Check In';
            }
        }

        function showResult(data) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = false;
            btn.textContent = 'Check In';

            if (data.success) {
                document.getElementById('form-section').style.display = 'none';
                showMessage('success', `\u2705 Welcome, <strong>${data.matchedName}</strong>!<br>You're marked present today.`);
            } else if (data.alreadyCheckedIn) {
                document.getElementById('form-section').style.display = 'none';
                showMessage('warning', `\u26A0\uFE0F <strong>${data.matchedName}</strong>, you're already marked present today.`);
            } else if (data.noMatch) {
                showMessage('error', '\u274C Name not found on the roster.<br>Please ask your instructor.');
            } else if (data.error) {
                showMessage('error', `\u274C ${data.error}`);
            }
        }

        function showMessage(type, html) {
            const el = document.getElementById('result');
            el.className = `result ${type}`;
            el.innerHTML = html;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
